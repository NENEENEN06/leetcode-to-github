<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">leetcode-to-github — 把 LeetCode 刷题记录整理成规范中文题解并提交到 GitHub 的 Agent Skill</title>
  <desc id="desc">左侧为项目名称、一句话介绍与 npx 安装命令；右侧展示一次真实整理流程：输入题目和代码后，Agent 生成 0053-maximum-subarray 题解目录、更新索引并按规范提交。</desc>

  <rect width="1200" height="380" rx="26" fill="#0d1117"/>

  <g id="title-block">
    <rect x="56" y="76" width="10" height="10" rx="2" fill="#ffa116"/>
    <text x="76" y="90" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace"
          font-size="19" letter-spacing="1" fill="#8b949e">AGENT SKILL · CODEX / CLAUDE CODE</text>

    <text x="54" y="152" font-size="68" font-weight="800" fill="#ffa116">leetcode</text>
    <text x="54" y="222" font-size="68" font-weight="800" fill="#e6edf3">to-github</text>

    <text x="56" y="278" font-size="24" fill="#c9d1d9">把 LeetCode 刷题记录沉淀成规范的中文题解仓库</text>

    <rect x="56" y="300" width="556" height="44" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="78" y="329" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace"
          font-size="20" font-weight="700" fill="#3fb950">$</text>
    <text x="98" y="329" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace"
          font-size="20" fill="#e6edf3">npx github:NENEENEN06/leetcode-to-github</text>
  </g>

  <g id="proof-panel">
    <rect x="700" y="40" width="444" height="312" rx="14" fill="#161b22" stroke="#30363d"/>

    <text x="724" y="78" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace"
          font-size="16" fill="#8b949e">~/leetcode-solutions</text>
    <circle cx="1076" cy="72" r="4" fill="#30363d"/>
    <circle cx="1096" cy="72" r="4" fill="#30363d"/>
    <circle cx="1116" cy="72" r="4" fill="#30363d"/>
    <line x1="724" y1="96" x2="1120" y2="96" stroke="#30363d"/>

    <text x="724" y="128" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace"
          font-size="20" font-weight="700" fill="#ffa116">></text>
    <text x="748" y="128" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace"
          font-size="20" fill="#e6edf3">整理 LeetCode 53，粘贴我的代码</text>

    <text x="724" y="162" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace"
          font-size="20" font-weight="700" fill="#3fb950">✓</text>
    <rect x="748" y="138" width="74" height="34" rx="8" fill="#ffa116" fill-opacity="0.12" stroke="#ffa116"/>
    <text x="785" y="161" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace"
          font-size="18" font-weight="700" fill="#ffa116">0053</text>
    <text x="838" y="162" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace"
          font-size="20" fill="#e6edf3">maximum-subarray/</text>

    <text x="768" y="198" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace"
          font-size="17" fill="#484f58">├─</text>
    <text x="800" y="198" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace"
          font-size="17" fill="#c9d1d9">README.md</text>
    <text x="936" y="197" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace"
          font-size="16" fill="#8b949e">思路·复杂度·复盘</text>

    <text x="768" y="228" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace"
          font-size="17" fill="#484f58">└─</text>
    <text x="800" y="228" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace"
          font-size="17" fill="#c9d1d9">solution.cpp</text>
    <text x="936" y="227" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace"
          font-size="16" fill="#8b949e">我的代码原样保存</text>

    <text x="724" y="266" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace"
          font-size="20" font-weight="700" fill="#3fb950">✓</text>
    <text x="748" y="266" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace"
          font-size="20" fill="#e6edf3">更新根目录题目索引</text>

    <circle cx="730" cy="300" r="5" fill="#3fb950"/>
    <text x="748" y="306" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace"
          font-size="18" fill="#e6edf3">feat(leetcode): add</text>
    <rect x="965" y="284" width="74" height="34" rx="8" fill="#ffa116" fill-opacity="0.12" stroke="#ffa116"/>
    <text x="1002" y="307" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace"
          font-size="18" font-weight="700" fill="#ffa116">0053</text>
  </g>
</svg>
